name: city-report

# Per-skill CI + release for the city-report skill (Python). See devlog.yml for the
# PR/push trigger + change-detection rationale: the `pull_request` trigger is
# deliberately UN-filtered so `ci / city-report` reports on every PR (running real
# tests when this skill changed, short-circuiting to success when it didn't), which
# is what keeps the required-check set always satisfiable for a dev -> main PR.
# The `push` trigger IS path-filtered so the skill only releases when its own files changed.
on:
  push:
    branches: [main]
    paths: ["skills/city-report/**", "tools/score_skill.py", "tools/lint_plugin.py", ".github/workflows/city-report.yml"]
  pull_request:
    branches: [dev, main, 'feature/**']
  workflow_dispatch:

jobs:
  ci:
    name: ci / city-report # distinct check-run name so it can be a required status check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # required by dorny/paths-filter on pull_request events
    steps:
      - uses: actions/checkout@v7
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            city-report:
              - 'skills/city-report/**'
              - 'tools/score_skill.py'
              - 'tools/lint_plugin.py'
              - '.github/workflows/city-report.yml'
      - if: steps.changes.outputs.city-report == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Tier 1: shared SKILL.md structural lint (SKILL.md lives at the plugin's
      # auto-discovery path, skills/city-report/skills/city-report/)
      - if: steps.changes.outputs.city-report == 'true'
        run: python tools/score_skill.py skills/city-report/skills/city-report --min 100
      # Tier 1.5: plugin.json <-> SKILL.md name+version consistency
      - if: steps.changes.outputs.city-report == 'true'
        run: python tools/lint_plugin.py skills/city-report
      # Tier 2: the skill's own tests at 100% coverage. The `live` marker is
      # deselected by pytest.ini, so CI needs no network access.
      - if: steps.changes.outputs.city-report == 'true'
        run: pip install -r requirements-dev.txt
        working-directory: skills/city-report/skills/city-report
      - if: steps.changes.outputs.city-report == 'true'
        run: pytest --cov=scripts --cov-report=term-missing --cov-fail-under=100
        working-directory: skills/city-report/skills/city-report

  release:
    needs: ci
    # Real push to main (when re-coupled via a PAT) OR a deliberate manual dispatch on main.
    # The bot GITHUB_TOKEN auto-merge doesn't trigger push events, so workflow_dispatch is the on-demand release path.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_release.yml
    with:
      skill: city-report
    permissions:
      contents: write
