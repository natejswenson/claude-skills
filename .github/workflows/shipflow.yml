name: shipflow

# Per-skill CI + release for the shipflow skill.
# - PR trigger is intentionally NOT path-filtered, so the `ci` check ALWAYS reports
#   on every PR to dev/main (required-check + path-filter deadlock avoidance). The
#   dorny/paths-filter step short-circuits the heavy steps when shipflow is unchanged.
# - `feature/**` is in the PR base list so each layer of a stacked PR gets its own
#   `ci / shipflow` run. Without it a stacked layer (whose base is the branch below
#   it, not dev) would get NO checks at all. Keep it when editing this trigger.
# - push trigger IS path-filtered and now runs ONLY `ci`. It cuts nothing: the
#   release job is workflow_dispatch-only, because /release is the single
#   release path and dispatches it deliberately (see the release job below).
on:
  push:
    branches: [main]
    paths: ["skills/shipflow/**", "tools/score_skill.py", "tools/lint_plugin.py", ".github/workflows/shipflow.yml"]
  pull_request:
    branches: [dev, main, 'feature/**']
  workflow_dispatch:

jobs:
  ci:
    name: ci / shipflow # distinct check-run name so it can be a required status check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # required by dorny/paths-filter on pull_request events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            shipflow:
              - 'skills/shipflow/**'
              - 'tools/score_skill.py'
              - 'tools/lint_plugin.py'
              - '.github/workflows/shipflow.yml'
      # Tier 1: shared SKILL.md structural lint (every skill)
      - if: steps.changes.outputs.shipflow == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - if: steps.changes.outputs.shipflow == 'true'
        run: python tools/score_skill.py skills/shipflow/skills/shipflow --min 100
      # Tier 1.5: plugin.json <-> SKILL.md/package.json name+version consistency
      - if: steps.changes.outputs.shipflow == 'true'
        run: python tools/lint_plugin.py skills/shipflow
      # Tier 2: shipflow functional tests (Node)
      - if: steps.changes.outputs.shipflow == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skills/shipflow/skills/shipflow/package-lock.json
      - if: steps.changes.outputs.shipflow == 'true'
        run: npm install --no-fund
        working-directory: skills/shipflow/skills/shipflow
      - if: steps.changes.outputs.shipflow == 'true'
        run: npm test
        working-directory: skills/shipflow/skills/shipflow
      - if: steps.changes.outputs.shipflow == 'true'
        run: npm run audit
        working-directory: skills/shipflow/skills/shipflow

  release:
    needs: ci
    # workflow_dispatch ONLY. A push to main must never cut a tag: the /release
    # skill is the single release path, and it dispatches this workflow itself
    # after the promotion lands. A dev -> main merge DOES fire push events
    # (confirmed 2026-08-02: shipflow-v0.4.0 was tagged and published to npm by
    # a promotion merging, with no dispatch), so gating on the event is what
    # actually stops it -- the push trigger above still runs `ci`, nothing more.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_release.yml
    with:
      skill: shipflow
      npm-publish: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: write
