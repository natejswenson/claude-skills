name: tools

# CI for the shared repo tooling (the Tier-1 SKILL.md scorer that gates every
# skill). Path-filtered to tools/** and intentionally NOT a required status check,
# so it never participates in the per-skill required-check set (no deadlock).
on:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/tools.yml"]
  pull_request:
    branches: [dev, main, 'feature/**']
    paths: ["tools/**", ".github/workflows/tools.yml"]
  workflow_dispatch:

# Deny-all floor: this job only reads code and runs the scorer.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements-dev.txt
      - run: python -m pytest tools/tests -q
