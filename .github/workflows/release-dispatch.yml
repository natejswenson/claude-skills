name: release skill

# A main push or PR can never tag or publish. Select exactly one registered skill.
on:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Registered skill to release after its reviewed version/changelog lands on main.'
        required: true
        type: string

permissions: {}

jobs:
  select:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skill: ${{ steps.select.outputs.skill }}
      npm-publish: ${{ steps.select.outputs.npm-publish }}
      version-source: ${{ steps.select.outputs.version-source }}
      propagate: ${{ steps.select.outputs.propagate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate release selection and options
        id: select
        env:
          SKILL: ${{ inputs.skill }}
        run: node tools/skills-ci.mjs select

  verify:
    needs: select
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      skill: ${{ needs.select.outputs.skill }}

  release:
    needs: [select, verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: ./.github/workflows/_release.yml
    with:
      skill: ${{ needs.select.outputs.skill }}
      version-source: ${{ needs.select.outputs.version-source }}
      npm-publish: ${{ fromJSON(needs.select.outputs.npm-publish) }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  propagate:
    needs: [select, release]
    if: needs.select.outputs.propagate == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/press-propagate.yml
    secrets:
      PRESS_PROPAGATE_TOKEN: ${{ secrets.PRESS_PROPAGATE_TOKEN }}
