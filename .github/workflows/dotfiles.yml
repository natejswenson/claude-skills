name: dotfiles

# Per-skill CI + release for the dotfiles skill. The `pull_request` trigger is
# deliberately UN-filtered so `ci / dotfiles` reports on every PR — running real
# tests when this skill changed and short-circuiting to success when it didn't —
# which keeps required checks available on every supported PR base.
# Push CI is path-filtered; only explicit workflow_dispatch can release.
on:
  push:
    branches: ["main"]
    paths:
      - "skills/dotfiles/**"
      - "tools/score_skill.py"
      - "tools/lint_plugin.py"
      - ".github/workflows/dotfiles.yml"
  pull_request:
    branches: ["main", "feature/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci / dotfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            dotfiles:
              - 'skills/dotfiles/**'
              - 'skills/press/skills/press/**'
              - 'tools/score_skill.py'
              - 'tools/lint_plugin.py'
              - '.github/workflows/dotfiles.yml'

      - if: steps.changes.outputs.dotfiles == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - if: steps.changes.outputs.dotfiles == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Tier 1 — the SKILL.md lint
      - if: steps.changes.outputs.dotfiles == 'true'
        run: |
          python tools/score_skill.py skills/dotfiles/skills/dotfiles --min 100

      # Tier 1.5 — plugin manifest / version tie
      - if: steps.changes.outputs.dotfiles == 'true'
        run: |
          python tools/lint_plugin.py skills/dotfiles

      # Tier 1.6 — brand drift, this skill's regions only
      - if: steps.changes.outputs.dotfiles == 'true'
        run: |
          node skills/press/skills/press/bin/press.js check --repo . --target dotfiles-readme

      # Tier 2 — dotfiles's own suite. Offline and $0 by construction: the
      # baseline never calls the network, so CI cannot spend and cannot flake.
      - if: steps.changes.outputs.dotfiles == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --offline
        working-directory: skills/dotfiles/skills/dotfiles

      - if: steps.changes.outputs.dotfiles == 'true'
        run: |
          npm test
        working-directory: skills/dotfiles/skills/dotfiles

      - if: steps.changes.outputs.dotfiles == 'true'
        run: |
          npm run audit -- --offline
        working-directory: skills/dotfiles/skills/dotfiles

  release:
    needs: ci
    # Dispatch-only, deliberately. Never re-add `push` here: a dev → main
    # auto-merge fires push events, which made promotions publish-on-merge and
    # cost two unplanned releases. `/release` dispatches this job.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_release.yml
    with:
      skill: dotfiles
    permissions:
      contents: write
