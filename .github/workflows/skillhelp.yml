name: skillhelp

# Per-skill CI + release for the skillhelp skill. The `pull_request` trigger is
# deliberately UN-filtered so `ci / skillhelp` reports on every PR — running real
# tests when this skill changed and short-circuiting to success when it didn't —
# which is what keeps the required-check set always satisfiable for a dev -> main
# PR. The `push` trigger IS path-filtered so the skill only releases when its own
# files changed.
#
# UNLIKE every other caller, the job's paths-filter matches `skills/**`, not just
# this skill's own directory: skillhelp's committed cards describe all the OTHER
# skills, so any of them changing is what makes its index stale. See the filter.
on:
  push:
    branches: [main]
    paths:
      - "skills/skillhelp/**"
      - "tools/score_skill.py"
      - "tools/lint_plugin.py"
      - ".github/workflows/skillhelp.yml"
  pull_request:
    branches: [dev, main, 'feature/**']
  workflow_dispatch:

jobs:
  ci:
    name: ci / skillhelp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            skillhelp:
              # skillhelp indexes EVERY skill, so a change to ANY of them can make
              # its committed cards stale. Filtering to 'skills/skillhelp/**' would
              # short-circuit this job to green on exactly the PR that causes the
              # drift — the gate would never fire. Do not narrow this glob.
              - 'skills/**'
              - 'tools/score_skill.py'
              - 'tools/lint_plugin.py'
              - '.github/workflows/skillhelp.yml'

      - if: steps.changes.outputs.skillhelp == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - if: steps.changes.outputs.skillhelp == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Tier 1 — the SKILL.md lint
      - if: steps.changes.outputs.skillhelp == 'true'
        run: python tools/score_skill.py skills/skillhelp/skills/skillhelp --min 100

      # Tier 1.5 — plugin manifest / version tie
      - if: steps.changes.outputs.skillhelp == 'true'
        run: python tools/lint_plugin.py skills/skillhelp

      # Tier 1.6 — brand drift, this skill's regions only
      - if: steps.changes.outputs.skillhelp == 'true'
        run: node skills/press/skills/press/bin/press.js check --repo . --target skillhelp-agent-ui --target skillhelp-readme

      # Tier 2 — skillhelp's own suite. Offline and $0 by construction: the
      # baseline never calls the network, so CI cannot spend and cannot flake.
      - if: steps.changes.outputs.skillhelp == 'true'
        run: npm install --no-fund
        working-directory: skills/skillhelp/skills/skillhelp

      - if: steps.changes.outputs.skillhelp == 'true'
        run: npm test
        working-directory: skills/skillhelp/skills/skillhelp

      - if: steps.changes.outputs.skillhelp == 'true'
        run: npm run audit
        working-directory: skills/skillhelp/skills/skillhelp

  release:
    needs: ci
    # Dispatch-only, deliberately. Never re-add `push` here: a dev → main
    # auto-merge fires push events, which made promotions publish-on-merge and
    # cost two unplanned releases. `/release` dispatches this job.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_release.yml
    with:
      skill: skillhelp
    permissions:
      contents: write
