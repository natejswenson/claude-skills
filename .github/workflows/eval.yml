name: eval

# Per-skill CI + release for the eval skill. The `pull_request` trigger is
# deliberately UN-filtered so `ci / eval` reports on every PR — running real
# tests when this skill changed and short-circuiting to success when it didn't —
# which is what keeps the required-check set always satisfiable for a dev -> main
# PR. The `push` trigger IS path-filtered so the skill only releases when its own
# files changed.
on:
  push:
    branches: [main]
    paths:
      - "skills/eval/**"
      - "tools/score_skill.py"
      - "tools/lint_plugin.py"
      - ".github/workflows/eval.yml"
  pull_request:
    branches: [dev, main, 'feature/**']
  workflow_dispatch:

jobs:
  ci:
    name: ci / eval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            eval:
              - 'skills/eval/**'
              - 'skills/press/skills/press/**'
              - 'tools/score_skill.py'
              - 'tools/lint_plugin.py'
              - '.github/workflows/eval.yml'

      - if: steps.changes.outputs.eval == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - if: steps.changes.outputs.eval == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Tier 1 — the SKILL.md lint
      - if: steps.changes.outputs.eval == 'true'
        run: python tools/score_skill.py skills/eval/skills/eval --min 100

      # Tier 1.5 — plugin manifest / version tie
      - if: steps.changes.outputs.eval == 'true'
        run: python tools/lint_plugin.py skills/eval

      # Tier 1.6 — brand drift, this skill's regions only
      - if: steps.changes.outputs.eval == 'true'
        run: node skills/press/skills/press/bin/press.js check --repo . --target eval-agent-ui --target eval-readme

      # Tier 2 — eval's own suite. Offline and $0 by construction: the
      # baseline never calls the network, so CI cannot spend and cannot flake.
      - if: steps.changes.outputs.eval == 'true'
        run: npm install --no-fund
        working-directory: skills/eval/skills/eval

      - if: steps.changes.outputs.eval == 'true'
        run: npm test
        working-directory: skills/eval/skills/eval

      - if: steps.changes.outputs.eval == 'true'
        run: npm run audit
        working-directory: skills/eval/skills/eval

  release:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_release.yml
    with:
      skill: eval
    permissions:
      contents: write
