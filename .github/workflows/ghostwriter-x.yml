name: ghostwriter-x

# Per-skill CI + release for the ghostwriter-x skill (Python). See devlog.yml for the
# PR/push trigger + change-detection rationale. The pull_request trigger is deliberately
# un-filtered so `ci / ghostwriter-x` reports (green via short-circuit) on every PR —
# required for the dev → main auto-merge check set to stay satisfiable.
on:
  push:
    branches: [main]
    paths: ["skills/ghostwriter-x/**", "tools/score_skill.py", "tools/lint_plugin.py", ".github/workflows/ghostwriter-x.yml"]
  pull_request:
    branches: [dev, main, 'feature/**']
  workflow_dispatch:

jobs:
  ci:
    name: ci / ghostwriter-x # distinct check-run name so it can be a required status check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # required by dorny/paths-filter on pull_request events
    steps:
      - uses: actions/checkout@v7
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ghostwriter-x:
              - 'skills/ghostwriter-x/**'
              - 'tools/score_skill.py'
              - 'tools/lint_plugin.py'
              - '.github/workflows/ghostwriter-x.yml'
      - if: steps.changes.outputs.ghostwriter-x == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Tier 1: shared SKILL.md structural lint (SKILL.md lives at the plugin's
      # auto-discovery path, skills/ghostwriter-x/skills/ghostwriter-x/)
      - if: steps.changes.outputs.ghostwriter-x == 'true'
        run: python tools/score_skill.py skills/ghostwriter-x/skills/ghostwriter-x --min 100
      # Tier 1.5: plugin.json <-> SKILL.md/package.json name+version consistency
      - if: steps.changes.outputs.ghostwriter-x == 'true'
        run: python tools/lint_plugin.py skills/ghostwriter-x
      # Tier 2: lint the bash, test the Python at 100% coverage
      - if: steps.changes.outputs.ghostwriter-x == 'true'
        run: pip install -r requirements-dev.txt
        working-directory: skills/ghostwriter-x/skills/ghostwriter-x
      - if: steps.changes.outputs.ghostwriter-x == 'true'
        run: shellcheck scripts/release_radar.sh
        working-directory: skills/ghostwriter-x/skills/ghostwriter-x
      - if: steps.changes.outputs.ghostwriter-x == 'true'
        run: pytest --cov=scripts --cov=evals --cov-report=term-missing --cov-fail-under=100
        working-directory: skills/ghostwriter-x/skills/ghostwriter-x

  release:
    needs: ci
    # Real push to main (when re-coupled via a PAT) OR a deliberate manual dispatch on main.
    # The bot GITHUB_TOKEN auto-merge doesn't trigger push events, so workflow_dispatch is the on-demand release path.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_release.yml
    with:
      skill: ghostwriter-x
    permissions:
      contents: write
