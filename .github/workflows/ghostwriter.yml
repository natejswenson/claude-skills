name: ghostwriter

# Per-skill CI + release for the ghostwriter skill (Python). See devlog.yml for the
# PR/push trigger + change-detection rationale. SKILL.md scoring now comes from the
# shared Tier-1 gate (tools/score_skill.py); ghostwriter's bespoke score_skill.py is
# removed (see the design doc's score_skill.py consolidation).
on:
  push:
    branches: [main]
    paths: ["skills/ghostwriter/**", "tools/score_skill.py", "tools/lint_plugin.py", ".github/workflows/ghostwriter.yml"]
  pull_request:
    branches: [dev, main, 'feature/**']
  workflow_dispatch:

jobs:
  ci:
    name: ci / ghostwriter # distinct check-run name so it can be a required status check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # required by dorny/paths-filter on pull_request events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            ghostwriter:
              - 'skills/ghostwriter/**'
              - 'tools/score_skill.py'
              - 'tools/lint_plugin.py'
              - '.github/workflows/ghostwriter.yml'
      - if: steps.changes.outputs.ghostwriter == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Tier 1: shared SKILL.md structural lint (SKILL.md lives at the plugin's
      # auto-discovery path, skills/ghostwriter/skills/ghostwriter/)
      - if: steps.changes.outputs.ghostwriter == 'true'
        run: python tools/score_skill.py skills/ghostwriter/skills/ghostwriter --min 100
      # Tier 1.5: plugin.json <-> SKILL.md/package.json name+version consistency
      - if: steps.changes.outputs.ghostwriter == 'true'
        run: python tools/lint_plugin.py skills/ghostwriter
      # Tier 1.6: this skill's brand block is a generated region owned by the
      # `press` skill. Fails if it was hand-edited, or if the tokens moved and
      # nobody re-emitted — so drift is caught in the PR that causes it rather
      # than whenever someone next happens to touch press. (Node is preinstalled
      # on ubuntu-latest; press has no dependencies.)
      - if: steps.changes.outputs.ghostwriter == 'true'
        run: node skills/press/skills/press/bin/press.js check --repo . --target ghostwriter-card
      # Tier 2: lint the bash, test the Python at 100% coverage
      - if: steps.changes.outputs.ghostwriter == 'true'
        run: pip install -r requirements-dev.txt
        working-directory: skills/ghostwriter/skills/ghostwriter
      - if: steps.changes.outputs.ghostwriter == 'true'
        run: shellcheck scripts/release_radar.sh
        working-directory: skills/ghostwriter/skills/ghostwriter
      - if: steps.changes.outputs.ghostwriter == 'true'
        run: pytest --cov=scripts --cov=evals --cov-report=term-missing --cov-fail-under=100
        working-directory: skills/ghostwriter/skills/ghostwriter

  release:
    needs: ci
    # Real push to main (when re-coupled via a PAT) OR a deliberate manual dispatch on main.
    # The bot GITHUB_TOKEN auto-merge doesn't trigger push events, so workflow_dispatch is the on-demand release path.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_release.yml
    with:
      skill: ghostwriter
    permissions:
      contents: write
