name: skills CI

on:
  push:
    branches: [main]
    paths: ['skills/**', 'tools/**', '.github/**']
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      skill:
        description: 'Run real CI for this registered skill; empty runs all skills.'
        type: string
        default: ''

permissions: {}

jobs:
  prepare:
    name: prepare skill CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate registries and build change filters
        id: config
        run: node tools/skills-ci.mjs filters
      - name: Detect relevant changes
        id: changes
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_call' && inputs.skill == ''
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: ${{ steps.config.outputs.filters }}
      - name: Plan every required skill check
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_SKILLS: ${{ steps.changes.outputs.changes || '[]' }}
          SKILL: ${{ inputs.skill }}
        run: node tools/skills-ci.mjs plan

  ci:
    name: ci / ${{ matrix.skill }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    concurrency:
      group: skill-ci-${{ matrix.skill }}-${{ matrix.concurrency == 'none' && format('{0}-{1}', github.run_id, github.run_attempt) || github.ref }}
      cancel-in-progress: ${{ matrix.concurrency == 'cancel-pr' && github.event_name == 'pull_request' }}
    steps:
      - name: Unchanged skill
        if: ${{ !matrix.changed }}
        run: echo 'No relevant changes; required check succeeds.'
      - if: matrix.changed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.changed
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.changed && matrix.node != '' && matrix.npmCache == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.changed && matrix.npmCache != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.npmCache }}
      - name: Skill lint, brand checks and tests
        if: matrix.changed
        env:
          SKILL: ${{ matrix.skill }}
        run: node tools/skills-ci.mjs run
