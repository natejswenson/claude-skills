name: press

# Per-skill CI + release for the press skill. See devlog.yml for the PR/push
# trigger + change-detection rationale (deadlock avoidance).
#
# press is unusual: it owns generated regions inside OTHER skills' files, so its
# change filter includes every file it writes to. A token edit that lands
# without re-emitting must fail *this* job, not go unnoticed until someone
# happens to touch city-report.
on:
  push:
    branches: [main]
    paths: ["skills/press/**", "tools/score_skill.py", "tools/lint_plugin.py", ".github/workflows/press.yml"]
  pull_request:
    branches: [dev, main, 'feature/**']
  workflow_dispatch:

# Deny-all floor. Each job below re-declares only the scopes it actually uses.
permissions: {}

jobs:
  ci:
    name: ci / press # distinct check-run name so it can be a required status check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # required by dorny/paths-filter on pull_request events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            press:
              - 'skills/press/**'
              - 'tools/score_skill.py'
              - 'tools/lint_plugin.py'
              - '.github/workflows/press.yml'
              # Every file press generates a region into. Editing one of these
              # by hand is exactly the drift this job exists to catch.
              - 'skills/city-report/skills/city-report/scripts/brand.py'
              - 'skills/resume/skills/resume/assets/themes/press.css'
              - 'skills/ghostwriter/skills/ghostwriter/assets/diagram.css.example'
              - 'skills/ghostwriter-x/skills/ghostwriter-x/assets/diagram.css.example'
              - 'skills/devlog/skills/devlog/image-style/style-guide.example.md'
      # Tier 1: shared SKILL.md structural lint
      - if: steps.changes.outputs.press == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - if: steps.changes.outputs.press == 'true'
        run: python tools/score_skill.py skills/press/skills/press --min 100
      # Tier 1.5: plugin.json <-> SKILL.md/package.json name+version consistency
      - if: steps.changes.outputs.press == 'true'
        run: python tools/lint_plugin.py skills/press
      # Tier 2: press unit suite + baseline eval (Node, offline, no deps).
      # python3 is needed by one emit test, which executes the generated theme
      # module to prove it is importable rather than merely well-formed.
      - if: steps.changes.outputs.press == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - if: steps.changes.outputs.press == 'true'
        run: npm test
        working-directory: skills/press/skills/press
      # Tier 3: the drift gate itself. This is the check that makes the brand a
      # system rather than a convention — it fails if any consumer's generated
      # region no longer matches what the tokens produce, if a region has been
      # deleted, or if it resolved no targets at all.
      - if: steps.changes.outputs.press == 'true'
        run: node skills/press/skills/press/bin/press.js check --repo .

  release:
    needs: ci
    # workflow_dispatch ONLY. A push to main must never cut a tag: the /release
    # skill is the single release path, and it dispatches this workflow itself
    # after the promotion lands. A dev -> main merge DOES fire push events
    # (confirmed 2026-08-02: shipflow-v0.4.0 was tagged and published to npm by
    # a promotion merging, with no dispatch), so gating on the event is what
    # actually stops it -- the push trigger above still runs `ci`, nothing more.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_release.yml
    with:
      skill: press
      npm-publish: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: write

  # Fan the new brand out to every consumer repo. Chained off `release` rather
  # than a tag trigger, because a tag created with GITHUB_TOKEN fires nothing.
  propagate:
    needs: release
    # Explicit, and load-bearing: the workflow-level `permissions: {}` floor is a
    # CEILING for a called workflow, not a default it can widen. Without this the
    # reusable workflow's own `contents: read` is unreachable and its checkout
    # fails — the fan-out would break silently on the next release.
    permissions:
      contents: read
    uses: ./.github/workflows/press-propagate.yml
    secrets:
      PRESS_PROPAGATE_TOKEN: ${{ secrets.PRESS_PROPAGATE_TOKEN }}
