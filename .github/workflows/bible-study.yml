name: bible-study

# Per-skill CI + release for the bible-study skill. The `pull_request` trigger is
# deliberately UN-filtered so `ci / bible-study` reports on every PR — running real
# tests when this skill changed and short-circuiting to success when it didn't —
# which keeps required checks available on every supported PR base.
# Push CI is path-filtered; only explicit workflow_dispatch can release.
on:
  push:
    branches: ["main"]
    paths:
      - "skills/bible-study/**"
      - "tools/score_skill.py"
      - "tools/lint_plugin.py"
      - ".github/workflows/bible-study.yml"
  pull_request:
    branches: ["main", "feature/**"]
  workflow_dispatch:

jobs:
  ci:
    name: ci / bible-study
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            bible-study:
              - 'skills/bible-study/**'
              - 'skills/press/skills/press/**'
              - 'tools/score_skill.py'
              - 'tools/lint_plugin.py'
              - '.github/workflows/bible-study.yml'

      - if: steps.changes.outputs.bible-study == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - if: steps.changes.outputs.bible-study == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Tier 1 — the SKILL.md lint
      - if: steps.changes.outputs.bible-study == 'true'
        run: python tools/score_skill.py skills/bible-study/skills/bible-study --min 100

      # Tier 1.5 — plugin manifest / version tie
      - if: steps.changes.outputs.bible-study == 'true'
        run: python tools/lint_plugin.py skills/bible-study

      # Tier 1.6 — brand drift, this skill's regions only
      - if: steps.changes.outputs.bible-study == 'true'
        run: |
          node skills/press/skills/press/bin/press.js check --repo . --target bible-study-readme
          node skills/press/skills/press/bin/press.js check --repo . --target bible-study-theme

      # Tier 2 — bible-study's own suite. Offline and $0 by construction: the
      # baseline never calls the network, so CI cannot spend and cannot flake.
      - if: steps.changes.outputs.bible-study == 'true'
        run: npm install --no-fund
        working-directory: skills/bible-study/skills/bible-study

      - if: steps.changes.outputs.bible-study == 'true'
        run: npm test
        working-directory: skills/bible-study/skills/bible-study

      - if: steps.changes.outputs.bible-study == 'true'
        run: npm run audit
        working-directory: skills/bible-study/skills/bible-study

  release:
    needs: ci
    # Dispatch-only, deliberately. Never re-add `push` here: a dev → main
    # auto-merge fires push events, which made promotions publish-on-merge and
    # cost two unplanned releases. `/release` dispatches this job.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_release.yml
    with:
      skill: bible-study
    permissions:
      contents: write
