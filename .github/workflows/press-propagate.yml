name: press propagate

# Pushes a brand change out to every consumer repo.
#
# Each consumer's own CI pins an exact press version — deliberately, because a
# mutable reference in a repo that auto-deploys to production is a supply-chain
# hole. But a pinned check passes forever against the version it was pinned to,
# so it can never notice the brand has moved on: natejswenson.io sat two
# releases behind with entirely green CI. That is the gap this closes.
#
# Freshness is PUSHED from the source of truth rather than polled. press
# re-emits into each consumer, bumps the pin, and opens a PR. Consumers still
# review and merge — nothing lands unreviewed — but nobody has to remember.
on:
  push:
    tags: ["press-v*"] # every press release
  schedule:
    - cron: "0 13 * * 1" # safety net: closed PRs, failed fan-outs, new consumers
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without opening PRs"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Which repos press is responsible for is derived from targets.json, never
      # a second list maintained here — adding a consumer stays one declaration.
      # `repo` is the logical/local name; `github` overrides it where the remote
      # differs (budget lives at natejswenson/local-budget).
      - name: Resolve consumer repos from targets.json
        id: consumers
        run: |
          set -euo pipefail
          repos=$(node -e "
            const { targets } = require('./skills/press/skills/press/targets.json');
            const out = new Map();
            for (const t of targets) {
              if (t.repo === 'claude-skills') continue;
              out.set(t.repo, t.github ?? t.repo);
            }
            console.log(JSON.stringify([...out.values()]));
          ")
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
          echo "Consumers: $repos"

      - name: Propagate to each consumer
        env:
          # A PAT is required: the default GITHUB_TOKEN is scoped to THIS repo and
          # can neither clone nor open a PR against another one. Without it the
          # job reports what it would have done and exits clean, rather than
          # failing a release over a missing credential.
          GH_TOKEN: ${{ secrets.PRESS_PROPAGATE_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run || false }}
          REPOS: ${{ steps.consumers.outputs.repos }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          version=$(node -p "require('./skills/press/skills/press/package.json').version")
          press="$PWD/skills/press/skills/press/bin/press.js"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PRESS_PROPAGATE_TOKEN is not set — skipping fan-out."
            echo "::warning::Consumers stay on their pinned version until it is added."
            for r in $(echo "$REPOS" | jq -r '.[]'); do
              echo "  would propagate press v$version to $OWNER/$r"
            done
            exit 0
          fi

          failures=0
          for repo in $(echo "$REPOS" | jq -r '.[]'); do
            echo "::group::$repo"
            work=$(mktemp -d)
            if ! gh repo clone "$OWNER/$repo" "$work" -- --depth=1 --quiet; then
              echo "::warning::could not clone $OWNER/$repo — skipping"
              echo "::endgroup::"
              continue
            fi

            summary=$(node "$press" propagate --repo "$work" --json --dry-run) || {
              echo "::warning::propagate failed for $repo"
              failures=$((failures + 1))
              echo "::endgroup::"
              continue
            }
            echo "$summary" | jq -r '.regions[] | "  \(.id): \(.status)"'
            changed=$(echo "$summary" | jq -r '.changed')
            stale=$(echo "$summary" | jq -r '[.stale[]] | join(", ")')

            if [ "$changed" != "true" ]; then
              echo "  already current — no PR"
              echo "::endgroup::"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "  WOULD open a PR (dry run)"
              echo "::endgroup::"
              continue
            fi

            node "$press" propagate --repo "$work" >/dev/null
            branch="press/brand-v$version"

            # Message bodies are written to files rather than inlined, so no line
            # of prose has to sit at a column YAML would read as ending the block.
            printf '%s\n' \
              "chore(brand): adopt press v$version" \
              "" \
              "Generated by press propagate. The token block is a generated region;" \
              "review the diff as the brand change it is, then merge." \
              "" \
              "Regions updated: $stale" > "$work/.press-commit.txt"

            printf '%s\n' \
              "Automated by \`press propagate\` on the \`press-v$version\` release." \
              "" \
              "The generated brand region in this repo no longer matches the current tokens, so it has been re-emitted and the pinned press version bumped to \`$version\`." \
              "" \
              "**Review this as a brand change** — the diff is exactly what will change visually. If it should not ship, close this PR and the repo stays on its current pin; the next release offers it again." \
              "" \
              "Regions updated: $stale" > "$work/.press-body.md"

            (
              cd "$work" || exit 1
              base=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
              git config user.name "press[bot]"
              git config user.email "noreply@github.com"
              git checkout -q -b "$branch"
              git add -A -- ':!.press-commit.txt' ':!.press-body.md'
              git commit -q -F .press-commit.txt || exit 1
              git push -q -u origin "$branch" --force-with-lease || exit 1
              gh pr create --base "$base" --head "$branch" \
                --title "chore(brand): adopt press v$version" \
                --body-file .press-body.md \
                || echo "::warning::PR creation failed for $repo (one may already be open)"
            ) || failures=$((failures + 1))
            echo "::endgroup::"
          done

          # An unreachable consumer is a warning, never a failed release — the
          # release already happened, and the weekly run retries.
          if [ "$failures" -ne 0 ]; then
            echo "::warning::$failures consumer(s) could not be propagated; the weekly run will retry"
          fi
