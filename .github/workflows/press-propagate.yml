name: press propagate

# Pushes a brand change out to every consumer repo.
#
# Each consumer's own CI pins an exact press version — deliberately, because a
# mutable reference in a repo that auto-deploys to production is a supply-chain
# hole. But a pinned check passes forever against the version it was pinned to,
# so it can never notice the brand has moved on: natejswenson.io sat two
# releases behind with entirely green CI. That is the gap this closes.
#
# Freshness is PUSHED from the source of truth rather than polled. press
# re-emits into each consumer, bumps the pin, and opens a PR. Consumers still
# review and merge — nothing lands unreviewed — but nobody has to remember.
#
# NOTE ON THE TRIGGER. This deliberately does NOT use `push: tags: [press-v*]`.
# The release tag is created by `_release.yml` using the repository's
# GITHUB_TOKEN, and GitHub does not fire new workflow runs for events created
# with that token — so a tag trigger here would look correct and never once
# execute. Verified the hard way: press-v0.4.0 was tagged and published with
# zero propagate runs. The release path calls this workflow directly instead.
on:
  workflow_call:
    inputs:
      dry-run:
        description: "Report what would change without opening PRs"
        type: boolean
        default: false
    secrets:
      PRESS_PROPAGATE_TOKEN:
        description: "PAT with repo scope on the consumer repos"
        required: false
  schedule:
    - cron: "0 13 * * 1" # safety net: closed PRs, failed fan-outs, new consumers
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without opening PRs"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Which repos press is responsible for is derived from targets.json, never
      # a second list maintained here — adding a consumer stays one declaration.
      # `repo` is the logical/local name; `github` overrides it where the remote
      # differs (budget lives at natejswenson/local-budget).
      - name: Resolve consumer repos from targets.json
        id: consumers
        run: |
          set -euo pipefail
          repos=$(node -e "
            const { targets } = require('./skills/press/skills/press/targets.json');
            const out = new Map();
            for (const t of targets) {
              if (t.repo === 'claude-skills') continue;
              out.set(t.repo, t.github ?? t.repo);
            }
            console.log(JSON.stringify([...out.values()]));
          ")
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
          echo "Consumers: $repos"

      - name: Propagate to each consumer
        env:
          # A PAT is required: the default GITHUB_TOKEN is scoped to THIS repo and
          # can neither clone nor open a PR against another one. Without it the
          # job reports what it would have done and exits clean, rather than
          # failing a release over a missing credential.
          GH_TOKEN: ${{ secrets.PRESS_PROPAGATE_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run || false }}
          REPOS: ${{ steps.consumers.outputs.repos }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          version=$(node -p "require('./skills/press/skills/press/package.json').version")
          press="$PWD/skills/press/skills/press/bin/press.js"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PRESS_PROPAGATE_TOKEN is not set — skipping fan-out."
            echo "::warning::Consumers stay on their pinned version until it is added."
            for r in $(echo "$REPOS" | jq -r '.[]'); do
              echo "  would propagate press v$version to $OWNER/$r"
            done
            exit 0
          fi

          # `gh` authenticates its own API calls from GH_TOKEN, but a plain
          # `git push` does not — it has no credential helper and prompts for a
          # username, which on a runner fails with "No such device or address".
          # This wires gh in as git's credential helper for github.com. Without
          # it every push fails while cloning and PR-listing still work, which
          # is a confusing way to lose a fan-out.
          gh auth setup-git

          failures=0
          for repo in $(echo "$REPOS" | jq -r '.[]'); do
            echo "::group::$repo"
            work=$(mktemp -d)
            if ! gh repo clone "$OWNER/$repo" "$work" -- --quiet; then
              echo "::warning::could not clone $OWNER/$repo — skipping"
              echo "::endgroup::"
              continue
            fi

            # Propagate to EVERY long-lived branch that carries the brand, not
            # just one. Landing on `dev` alone leaves `main` — the branch that
            # actually ships — stale until someone remembers to promote, and
            # makes the next promotion carry an unrelated brand diff.
            default=$(gh repo view "$OWNER/$repo" --json defaultBranchRef --jq .defaultBranchRef.name)
            branches="$default"
            if (cd "$work" && git rev-parse --verify --quiet origin/dev >/dev/null); then
              branches="dev $default"
            fi
            echo "  branches: $branches"

            for base in $branches; do
            echo "  --- $base ---"
            (cd "$work" && git checkout -q -- . && git checkout -q "$base") || {
              echo "::warning::could not check out $base in $repo"; continue
            }
            summary=$(node "$press" propagate --repo "$work" --json --dry-run) || {
              echo "::warning::propagate failed for $repo@$base"
              failures=$((failures + 1))
              continue
            }
            echo "$summary" | jq -r '.regions[] | "  \(.id): \(.status)"'
            changed=$(echo "$summary" | jq -r '.changed')
            stale=$(echo "$summary" | jq -r '[.stale[]] | join(", ")')
            # A brand change alters what renders and must be reviewed as design.
            # A version-only adoption is routine. Saying which in the title keeps
            # review effort proportionate now that every release opens a PR.
            brand=$(echo "$summary" | jq -r '[.brand[]] | join(", ")')
            if [ -n "$brand" ]; then
              title="chore(brand): press v$version — BRAND VALUES CHANGED"
              lede="**The generated brand values changed.** Review this diff as a design change: it is exactly what will render differently. Regions affected: $brand."
            else
              title="chore(brand): adopt press v$version"
              lede="Routine version adoption — **no brand value changed**, so nothing renders differently. The diff is the recorded press version and the pinned CI reference moving together."
            fi

            if [ "$changed" != "true" ]; then
              echo "  already current — no PR"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "  WOULD open a PR into $base (dry run)"
              continue
            fi

            node "$press" propagate --repo "$work" >/dev/null
            branch="press/brand-v$version-$base"

            # Message bodies are written to files rather than inlined, so no line
            # of prose has to sit at a column YAML would read as ending the block.
            printf '%s\n' \
              "$title" \
              "" \
              "Generated by press propagate." \
              "" \
              "Regions updated: $stale" > "$work/.press-commit.txt"

            printf '%s\n' \
              "Automated by \`press propagate\` on the \`press-v$version\` release." \
              "" \
              "$lede" \
              "" \
              "The region and the pinned CI version move together, so this repo's pin, its region receipt and the current release stay one number. If this should not ship, close the PR — the repo keeps its current pin and the next release offers it again." \
              "" \
              "Regions updated: $stale" > "$work/.press-body.md"

            (
              cd "$work" || exit 1
              git config user.name "press[bot]"
              git config user.email "noreply@github.com"
              git checkout -q -b "$branch"
              git add -A -- ':!.press-commit.txt' ':!.press-body.md'
              git commit -q -F .press-commit.txt || exit 1
              git push -q -u origin "$branch" --force-with-lease || exit 1
              gh pr create --base "$base" --head "$branch" \
                --title "$title" \
                --body-file .press-body.md \
                || echo "::warning::PR creation failed for $repo (one may already be open)"
            ) || failures=$((failures + 1))
            done
            echo "::endgroup::"
          done

          # A failed consumer must FAIL this job. The release itself already
          # happened and is untouched by this — but a fan-out that silently does
          # nothing is worse than one that never ran, because the green tick says
          # the brand reached everywhere when it reached nowhere. That is exactly
          # what happened on 0.6.0: four pushes failed on missing git credentials
          # and the run reported success.
          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures of $(echo "$REPOS" | jq -r 'length') consumer(s) could not be propagated"
            exit 1
          fi
          echo "All consumers propagated or already current."
