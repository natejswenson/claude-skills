name: Security

# Security gate on every pull request, whatever its base. Four independent
# jobs, each catching a class the others cannot see:
#
#   codeql     — SAST over the Python and JS/TS sources
#   deps       — vulnerable or badly-licensed dependencies this PR *adds*
#   secrets    — credentials committed in the PR's own history
#   workflows  — the GitHub Actions attack surface, via forge's own ladder
#
# The `pull_request` trigger is deliberately UN-filtered. The per-skill callers
# list `[dev, main, 'feature/**']` because they only need to satisfy the
# required-check set; this one is a security gate, so "every PR" means every PR,
# including bases nobody has thought of yet.
#
# NOT a required check on `main` — see CLAUDE.md. Make it required only after it
# has gone green on its own for a while; a required check that flakes blocks
# every future merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: security / codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode: none is explicit on purpose — both languages are
      # interpreted, and leaving it unset makes CodeQL try autobuild first.
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: /language:${{ matrix.language }}

  deps:
    name: security / deps
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Diffs the dependency graph between base and head, so it only ever
      # reports what THIS PR introduces — pre-existing advisories stay out of
      # the way instead of red-lining every unrelated change.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  secrets:
    name: security / secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 is load-bearing — gitleaks walks the commit range, and a
      # shallow clone silently narrows that to a single commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  workflows:
    name: security / workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Both linters are installed at a PINNED version rather than left to
      # forge's fallbacks. `forge verify` degrades gracefully when a tool is
      # missing — it reports what it could not check and still exits 0 — which
      # is right for a laptop and wrong for a gate, where it would mean the
      # security rung silently stops running. Installing them here makes a
      # missing linter fail this step instead.
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install zizmor
        run: python -m pip install --disable-pip-version-check zizmor==1.29.0

      # Rung 0 is the reason this job exists: it resolves every `uses:` against
      # the GitHub API, so a hallucinated action, a deleted ref or a pin three
      # majors behind fails the PR. No linter checks that a ref exists. It does
      # mean this one job talks to the network, unlike the rest of this repo's
      # CI — a deliberate trade, since offline is exactly how the class of bug
      # it catches survives.
      - name: forge verify — every workflow in this repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: node skills/forge/skills/forge/bin/forge.js verify .github/workflows/*.yml
