name: marketplace

# Validates .claude-plugin/marketplace.json and every skill's plugin.json wiring.
# Deliberately UNFILTERED and UNCONDITIONAL (no dorny/paths-filter short-circuit,
# unlike the four per-skill callers): the lint is sub-second, and short-circuiting
# would let a PR adding/removing marketplace coverage slip through green without
# the membership invariant ever being evaluated. See
# docs/plans/2026-07-10-marketplace-plugin-topology-design.md, Components/S2.
#
# NOT YET a required status check -- see CLAUDE.md's Repo settings section. Per
# the design's S1 rollout rule, "ci / marketplace" is added to main's required
# checks only as a separate, later step, after this workflow is confirmed running
# successfully on main (a required context that's never reported blocks every
# PR forever -- fail-closed -- unlike a renamed existing context, which fails
# open and just silently un-requires).
on:
  pull_request:
    branches: [dev, main, 'feature/**']
  workflow_dispatch:

jobs:
  ci:
    name: ci / marketplace # will become a required status check in a LATER, separate step
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - run: python tools/lint_marketplace.py
      # Every skill must declare a baseline eval set whose test the runner
      # actually discovers and whose fixtures/corpus really exist. Lives here
      # rather than in the per-skill callers for the same reason as the
      # marketplace lint: it is a cross-skill invariant, and a path-filtered
      # check would let a PR adding a new skill pass green without it ever
      # being evaluated. See CLAUDE.md's "Baseline eval sets" section.
      - run: python tools/lint_baseline.py
      # Every skill must satisfy the house tier: wired into every registry, and
      # carrying a README in the house style. Here rather than in a per-skill
      # caller for the same reason as the two lints above -- a README edited in
      # SOME OTHER skill's PR would never be graded by a path-filtered check,
      # which is exactly how a house style rots one pull request at a time.
      # `verify --all` exits non-zero on any house-tier failure and shells out
      # to nothing, so this stays offline and sub-second.
      - run: node skills/smith/skills/smith/scripts/smith.js verify --all --repo .
