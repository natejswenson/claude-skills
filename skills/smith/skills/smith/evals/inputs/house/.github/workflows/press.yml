name: press

# Fixture house — one real caller, present so `readActionPins` has SHAs to read.
# smith never writes a SHA it remembered: the pins in a generated workflow are
# the ones this repo already trusts, taken from the callers it already ships.
on:
  pull_request:
    branches: [dev, main, 'feature/**']

jobs:
  ci:
    name: ci / press
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            press:
              - 'skills/press/**'

      - if: steps.changes.outputs.press == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - if: steps.changes.outputs.press == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
